<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Eldoria - Chargement</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&display=swap" rel="stylesheet">
<style>
	html, body {
		margin: 0;
		height: 100%;
		background: #000;
		overflow: hidden;
		cursor: none;
	}
	.fond {
		position: absolute;
		top: 0; left: 0; right: 0; bottom: 0;
		background-size: cover;
		background-position: center;
		opacity: 0;
		transform: scale(1.0);
		transition: opacity 2s ease, transform 12s linear;
	}
	.fond.visible {
		opacity: 1;
		transform: scale(1.08);
	}
	#voile {
		position: absolute;
		top: 0; left: 0; right: 0; bottom: 0;
		background: radial-gradient(ellipse at center, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.85) 100%);
	}
	#centre {
		position: absolute;
		top: 50%;
		left: 50%;
		width: 40vw;
		min-width: 320px;
		transform: translate(-50%, -50%);
		text-align: center;
	}
	#pourcent {
		font-family: "Cinzel", Georgia, "Times New Roman", serif;
		font-size: 2.4vw;
		color: #d8c08a;
		letter-spacing: 0.08em;
		margin-bottom: 1.2vw;
		text-shadow: 0 2px 8px #000;
		font-variant-numeric: tabular-nums;
	}
	#barre {
		height: 6px;
		background: #1a1a1a;
		border: 1px solid #3a3122;
		border-radius: 3px;
		overflow: hidden;
	}
	#remplissage {
		height: 100%;
		width: 0%;
		background: linear-gradient(90deg, #8a6a2c, #e3c37a);
		box-shadow: 0 0 10px rgba(227, 195, 122, 0.5);
	}
	#astuce {
		position: absolute;
		top: 100%;
		left: -20vw;
		right: -20vw;
		margin-top: 3vw;
		font-family: Georgia, "Times New Roman", serif;
		font-style: italic;
		font-size: 1.15vw;
		color: #cbb994;
		text-shadow: 0 1px 6px #000, 0 0 2px #000;
		opacity: 0;
		transition: opacity 1.2s ease;
	}
	#astuce.visible { opacity: 1; }
</style>
</head>
<body>
<div class="fond" id="fondA"></div>
<div class="fond" id="fondB"></div>
<div id="voile"></div>
<div id="centre">
	<div id="pourcent">0 %</div>
	<div id="barre"><div id="remplissage"></div></div>
	<div id="astuce"></div>
</div>
<script>
// Un seul pourcentage global, calculé à partir de ce que GMod envoie à la page
// (GameDetails, SetFilesNeeded, DownloadingFile, SetStatusChanged).
// Toujours croissant ; entre deux étapes il avance doucement vers le palier
// suivant pour ne jamais sembler figé.

var DL_DEBUT = 10;   // fin de la connexion, début des téléchargements
var DL_FIN   = 70;   // fin des téléchargements

// Étapes reconnues dans les messages de statut (minuscules) -> [palier atteint, plafond avant l'étape suivante]
var ETAPES = [
	["retrieving server info",  [3, 9]],
	["mounting addons",         [DL_FIN, 74]],
	["workshop complete",       [DL_FIN, 74]],
	["sending client info",     [74, 78]],
	["client info sent",        [78, 84]],
	["received all lua files",  [86, 90]],
	["starting lua",            [90, 95]],
	["lua started",             [95, 99]]
];

var cible = 0;        // valeur réelle atteinte
var plafond = 9;      // jusqu'où on peut « avancer doucement » sans nouvelle info
var affiche = 0;      // valeur affichée (lissée)
var fichiersAttendus = 0;
var fichiersVus = {};
var nbVus = 0;

function monter(valeur, nouveauPlafond) {
	if (valeur > cible) cible = valeur;
	if (nouveauPlafond !== undefined && nouveauPlafond > plafond) plafond = nouveauPlafond;
	if (plafond < cible) plafond = cible;
}

function majTelechargement() {
	// Le total n'est pas toujours connu (Workshop) : on garde une marge pour ne jamais atteindre 100 % trop tôt.
	var total = Math.max(fichiersAttendus, nbVus + 1);
	var part = Math.min(nbVus / total, 1);
	monter(DL_DEBUT + (DL_FIN - DL_DEBUT) * part, DL_DEBUT + (DL_FIN - DL_DEBUT) * Math.min((nbVus + 1) / total, 1));
}

function GameDetails() {
	monter(DL_DEBUT, DL_DEBUT + 5);
}

function SetFilesTotal(total) {}

function SetFilesNeeded(needed) {
	needed = Number(needed) || 0;
	if (nbVus + needed > fichiersAttendus) fichiersAttendus = nbVus + needed;
	majTelechargement();
}

function DownloadingFile(nom) {
	if (!fichiersVus[nom]) {
		fichiersVus[nom] = true;
		nbVus++;
	}
	if (cible < DL_DEBUT) monter(DL_DEBUT);
	majTelechargement();
}

function SetStatusChanged(statut) {
	var s = String(statut || "").toLowerCase();
	for (var i = 0; i < ETAPES.length; i++) {
		if (s.indexOf(ETAPES[i][0]) !== -1) {
			monter(ETAPES[i][1][0], ETAPES[i][1][1]);
			return;
		}
	}
}

var elPourcent = document.getElementById("pourcent");
var elRemplissage = document.getElementById("remplissage");
var dernier = Date.now();

function boucle() {
	var maintenant = Date.now();
	var dt = Math.min((maintenant - dernier) / 1000, 0.5);
	dernier = maintenant;

	// Avance lente vers le plafond (asymptotique : ne l'atteint jamais vraiment).
	if (cible < plafond) cible += (plafond - cible) * dt * 0.08;

	// Lissage de l'affichage vers la cible.
	affiche += (cible - affiche) * Math.min(dt * 6, 1);
	if (affiche > 100) affiche = 100;

	var p = Math.floor(affiche);
	elPourcent.textContent = p + " %";
	elRemplissage.style.width = affiche.toFixed(2) + "%";

	requestAnimationFrame(boucle);
}
requestAnimationFrame(boucle);

// Phrases qui présentent le serveur, en fondu toutes les quelques secondes (ordre mélangé).
var ASTUCES = [
	"Ah, et tu savais que tu pouvais pêcher ? Cannes, appâts, coins secrets… et des records à battre.",
	"Oui, oui, tu peux vraiment faire de la magie dans Eldoria. Encore faut-il s'éveiller à l'Arcane…",
	"Cinq pages d'un manuscrit chiffré se cachent dans le monde. Rassemble-les, et la magie s'ouvrira à toi.",
	"Certains mages savent prendre forme animale. Loup, ours, corbeau… à toi de découvrir les autres.",
	"Un chaudron, quelques plantes cueillies au bord du chemin, et te voilà alchimiste.",
	"Le palefrenier t'attend : choisis ta monture, nourris-la, et elle te restera fidèle.",
	"Tu peux te battre à cheval. Oui, vraiment.",
	"Épée et bouclier, épée longue, dagues ou lance : chaque arme a son style, ses combos et ses talents.",
	"Plus tu manies une arme, plus tu la maîtrises. Chaque arme a son propre niveau.",
	"Bûcheron, mineur, forgeron… récolte, fabrique, et équipe-toi de tes propres mains.",
	"Ton livre de progression (touche B) garde tout : tes talents, ton journal et ton bestiaire.",
	"Un seul compte, plusieurs vies : crée plusieurs personnages, chacun avec son nom, sa bourse et son histoire.",
	"Humain, homme-chat ou homme-lézard : de quel peuple viendras-tu ?",
	"Écris une lettre, glisse-la dans une boîte aux lettres… un corbeau la portera à son destinataire.",
	"Une tête mise à prix ? Passe au tableau des primes, la patente de chasseur fera le reste.",
	"La nuit tombe vraiment sur Eldoria. Garde une torche à portée de main.",
	"Armures, tenues, sacs, coffres : ton inventaire se range comme un vrai paquetage.",
	"Les armures se fabriquent à l'atelier. Les tenues, elles, ne te quittent jamais, même à la mort.",
	"La carte enchantée te montre le royaume vu du ciel.",
	"Tomber au combat n'est pas la fin : tu t'évanouis… puis tu te relèves.",
	"Garde un œil sur ton endurance, ton souffle et ta santé. Le monde ne fait pas de cadeaux.",
	"Les marchands achètent et vendent, le forgeron répare : ta bourse a toujours une utilité.",
	"Chaque niveau te donne des points à dépenser dans ton livre. À toi de choisir ta voie.",
	"Ici, on joue un rôle. Prends le temps de faire vivre ton personnage."
];

var elAstuce = document.getElementById("astuce");
var ordre = [];
for (var k = 0; k < ASTUCES.length; k++) ordre.push(k);
for (var m = ordre.length - 1; m > 0; m--) {
	var j = Math.floor(Math.random() * (m + 1));
	var t = ordre[m]; ordre[m] = ordre[j]; ordre[j] = t;
}
var indexAstuce = 0;

function astuceSuivante() {
	elAstuce.className = "";
	setTimeout(function () {
		elAstuce.textContent = ASTUCES[ordre[indexAstuce % ordre.length]];
		indexAstuce++;
		elAstuce.className = "visible";
	}, 1200);
}
astuceSuivante();
setInterval(astuceSuivante, 7000);

// Images de fond (fonds/fond_01.jpg …) en fondu enchaîné, ordre mélangé, sous un voile sombre.
var NB_FONDS = 11;
var fonds = [];
for (var f = 1; f <= NB_FONDS; f++) fonds.push("fonds/fond_" + (f < 10 ? "0" : "") + f + ".jpg");
for (var g = fonds.length - 1; g > 0; g--) {
	var h = Math.floor(Math.random() * (g + 1));
	var u = fonds[g]; fonds[g] = fonds[h]; fonds[h] = u;
}
var calques = [document.getElementById("fondA"), document.getElementById("fondB")];
var indexFond = 0, calqueActif = 0;

function fondSuivant() {
	var url = fonds[indexFond % fonds.length];
	indexFond++;
	var img = new Image();
	img.onload = function () {
		var neuf = calques[1 - calqueActif], ancien = calques[calqueActif];
		neuf.style.transition = "none";
		neuf.className = "fond";
		neuf.style.backgroundImage = "url('" + url + "')";
		void neuf.offsetWidth;
		neuf.style.transition = "";
		neuf.className = "fond visible";
		ancien.className = "fond";
		calqueActif = 1 - calqueActif;
	};
	img.src = url;
}
fondSuivant();
setInterval(fondSuivant, 9000);
</script>
</body>
</html>
